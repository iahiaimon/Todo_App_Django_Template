<!-- JavaScript for Sidebar Interactions -->
<script>
  // Toggle sidebar collapse (optional)
  let sidebarCollapsed = false;
  
  function toggleSidebar() {
    const sidebar = document.querySelector('.sidebar');
    const mainContent = document.querySelector('.flex-1');
    
    if (!sidebarCollapsed) {
      sidebar.classList.add('w-20');
      sidebar.classList.remove('w-80');
      mainContent.classList.add('ml-4');
      // Hide text, show only icons
      document.querySelectorAll('.sidebar span:not(.sr-only)').forEach(el => {
        if (!el.closest('.menu') && !el.closest('.user-profile')) {
          el.classList.add('hidden');
        }
      });
    } else {
      sidebar.classList.remove('w-20');
      sidebar.classList.add('w-80');
      mainContent.classList.remove('ml-4');
      document.querySelectorAll('.sidebar span').forEach(el => {
        el.classList.remove('hidden');
      });
    }
    sidebarCollapsed = !sidebarCollapsed;
  }

  // Add click handlers for list items
  document.querySelectorAll('.tasks div, .list div').forEach(item => {
    item.addEventListener('click', function(e) {
      // Remove active class from all items
      document.querySelectorAll('.tasks div, .list div').forEach(el => {
        el.classList.remove('bg-gray-800', 'text-white');
      });
      // Add active class to clicked item
      if (!e.target.closest('.group').classList.contains('border-dashed')) {
        e.target.closest('.group').classList.add('bg-gray-800', 'text-white');
      }
    });
  });
</script>

    background: #4b5563;
    border-radius: 10px;
  }

  .sidebar::-webkit-scrollbar-thumb:hover {
    background: #6b7280;
  }

  /* Smooth transitions */
  .sidebar {
    transition: width 0.3s ease-in-out;

  .sidebar .group {

  /* Active state for selected items */
  .sidebar .group.active {

</style>
