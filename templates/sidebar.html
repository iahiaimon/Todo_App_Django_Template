<div class="h-full bg-white rounded-2xl shadow-lg p-6 flex flex-col justify-between">
  <!-- Top Section -->
  <div>
    <!-- Header -->
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Menu</h1>

      <!-- Menu Icon -->
      <button class="p-2 hover:bg-gray-100 rounded-lg transition">
        <!-- bars icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6 text-gray-600"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>

    <!-- Search -->
    <div class="flex items-center bg-gray-100 rounded-xl px-3 py-2 mb-8">
      <!-- search icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-gray-500"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M21 21l-4.35-4.35"
        />
      </svg>

      <input
        type="text"
        placeholder="Search tasks"
        class="bg-transparent outline-none ml-3 w-full text-sm"
      />
    </div>

    <!-- Tasks -->
    <div class="mb-8">
      <p class="text-gray-400 text-sm mb-3">TASKS</p>

      <!-- Upcoming -->
      <div
        class="flex justify-between items-center p-2 hover:bg-gray-100 rounded-lg cursor-pointer group"
      >
        <div class="flex items-center gap-3">
          <!-- clock icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-blue-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3"
            />
          </svg>

          <span> Upcoming </span>
        </div>

        <span class="text-sm text-gray-400"> 10 </span>
      </div>

      <!-- Today -->
      <div
        class="flex justify-between items-center p-2 hover:bg-gray-100 rounded-lg cursor-pointer"
      >
        <div class="flex items-center gap-3">
          <!-- calendar icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-green-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 7V3m8 4V3"
            />
          </svg>

          Today
        </div>

        <span class="text-sm text-gray-400"> 5 </span>
      </div>
    </div>

    <!-- Lists -->
    <div>
      <p class="text-gray-400 text-sm mb-3">LISTS</p>

      <!-- Personal -->
      <div
        class="flex justify-between items-center p-2 hover:bg-gray-100 rounded-lg cursor-pointer"
      >
        <div class="flex items-center gap-3">
          <!-- user icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-purple-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5.121 17.804A9 9 0 1118.364 4.56"
            />
          </svg>

          Personal
        </div>

        <span class="text-sm text-gray-400"> 3 </span>
      </div>

      <!-- Work -->
      <div
        class="flex justify-between items-center p-2 hover:bg-gray-100 rounded-lg cursor-pointer"
      >
        <div class="flex items-center gap-3">
          <!-- briefcase icon -->
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="w-5 h-5 text-yellow-500"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12h6"
            />
          </svg>

          Work
        </div>

        <span class="text-sm text-gray-400"> 6 </span>
      </div>

      <!-- Add List -->
      <div
        class="flex items-center gap-3 p-2 hover:bg-blue-50 text-blue-500 rounded-lg cursor-pointer mt-2"
      >
        <!-- plus icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M12 4v16m8-8H4"
          />
        </svg>

        Add New List
      </div>
    </div>
  </div>

  <!-- Bottom Section -->
  <div class="border-t pt-4">
    <!-- Settings -->
    <div
      class="flex items-center gap-3 p-2 hover:bg-gray-100 rounded-lg cursor-pointer"
    >
      <!-- settings icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5 text-gray-600"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M12 6V3"
        />
      </svg>

      Settings
    </div>

    <!-- Logout -->
    <div
      class="flex items-center gap-3 p-2 hover:bg-red-50 text-red-500 rounded-lg cursor-pointer"
    >
      <!-- logout icon -->
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="w-5 h-5"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4"
        />
      </svg>

      Sign Out
    </div>
  </div>
</div>
